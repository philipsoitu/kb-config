meta:
  engine: 4.1.0
  version: 0.0.0
  author: philipsoitu
units:
  # choc sized switches
  kx: cx
  ky: cy
  # padding + 2mm
  px: kx + 2
  py: ky + 2
points:
  zones:
    matrix:
      key:
        padding: 1ky
        spread: 1kx
      columns:
        outer:
        pinky:
          key.stagger: 2

        ring:
          key.stagger: 2
        middle:
          key.stagger: 2
        index:
          key.stagger: -2
        inner:
          key.stagger: -2
      rows:
        bottom:
        home:
        top:
        num:
    thumbs-1:
      key:
        padding: 1ky
        spread: 1kx
      columns:
        layer:
        space:
          key.stagger: 2
      rows:
        cluster:
          shift: [0.5kx, -1ky - 3]
    thumbs-2:
      key:
        padding: 1ky
        spread: 1kx
      columns:
        layer:

          key.stagger: 2
      rows:
        cluster:
          splay: 12
          shift: [-1.3kx, -1.3ky]
        a:
outlines:
pcbs:
cases:
