meta:
  engine: 4.1.0
  version: 0.0.0
  author: philipsoitu
units:
  # choc sized switches
  kx: cx
  ky: cy
  # padding + 2mm
  px: kx + 2
  py: ky + 2
  $default_width: cx
  $default_height: cy
points:
  zones:
    matrix:
      key:
        padding: 1ky
        spread: 1kx
      columns:
        outer:
        pinky:
          key.stagger: 2

        ring:
          key.stagger: 2
        middle:
          key.stagger: 2
        index:
          key.stagger: -2
        inner:
          key.stagger: -2
      rows:
        bottom:
        home:
        top:
        num:
    thumb-lower:
      key:
        padding: 1ky
        spread: 1kx
      columns:
        left:
          rows.top.skip: true
        right:
          rows.top.skip: true
          key.stagger: -2
      rows:
        row:
          shift: [3.5kx, -1ky]
    thumb-upper:
      key:
        padding: 1ky
        spread: 1kx
      anchor:
        shift: [6kx, -1ky]
      columns:
        col:
          key.splay: -15
      rows:
        bottom:
        top:
  mirror: &mirror
    ref: matrix_inner_num
    distance: 4.5kx
outlines:
  raw:
    - what: rectangle
      where: true
      size: [kx, ky]
  keys:
    - what: rectangle
      where: true
      size: [kx-0.5,ky-0.5]
  board:
    - what: polygon
      operation: stack
      points:
        - ref: matrix_outer_num
          shift: [-0.5px, 0.5py]
        - ref: matrix_pinky_num
          shift: [-0.5px, 0.5py]
        - ref: matrix_ring_num
          shift: [-0.5px, 0.5py]
        - ref: matrix_middle_num
          shift: [-0.5px, 0.5py]
        - ref: matrix_middle_num
          shift: [0.5px, 0.5py]
        - ref: matrix_index_num
          shift: [0.5px, 0.5py]
        - ref: matrix_inner_num
          shift: [0.5px, 0.5py]
        - ref: matrix_inner_home
          shift: [0.5px, 0.0py]
        - ref: thumb-upper_col_top
          shift: [0.5px, 0.5py]
        - ref: thumb-upper_col_bottom
          shift: [0.5px, -0.5py]
        - ref: thumb-upper_col_bottom
          shift: [-0.5px, -0.5py]
        - ref: thumb-lower_right_row
          shift: [0.5px, -0.5py]
        - ref: thumb-lower_right_row
          shift: [-0.5px,-0.5py]
        - ref: thumb-lower_left_row
          shift: [-0.5px,-0.5py]
        - ref: matrix_outer_bottom
          shift: [-0.5px, -0.5py]
      fillet: 2
pcbs:
cases:
